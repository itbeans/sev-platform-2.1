# Phase 3 — automated sync (well-defined OCPI/OICP external contracts)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ev-roaming
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ev-platform

  source:
    repoURL: https://github.com/itbeans/sev-platform-2.1
    targetRevision: main
    path: helm/charts/ev-roaming
    helm:
      valueFiles:
        - ../../../argocd/values/staging.yaml
        - ../../../argocd/values/image-tags.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: ev-platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
