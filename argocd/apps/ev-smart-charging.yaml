# Phase 4 — MANUAL sync (real-time charging profile application; last before OCPP core)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ev-smart-charging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ev-platform

  source:
    repoURL: https://github.com/itbeans/ev-server
    targetRevision: main
    path: scala-services/helm/charts/ev-smart-charging
    helm:
      valueFiles:
        - ../../../argocd/values/staging.yaml
        - ../../../argocd/values/image-tags.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: ev-platform

  # No syncPolicy.automated — operator must run `argocd app sync ev-smart-charging`
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
