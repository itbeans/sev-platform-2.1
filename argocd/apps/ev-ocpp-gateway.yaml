# Phase 4 — MANUAL sync (WebSocket connection registry; stickiness critical)
# Kong upstream weight must be adjusted to 0% TypeScript before syncing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ev-ocpp-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ev-platform

  source:
    repoURL: https://github.com/itbeans/ev-server
    targetRevision: main
    path: scala-services/helm/charts/ev-ocpp-gateway
    helm:
      valueFiles:
        - ../../../argocd/values/staging.yaml
        - ../../../argocd/values/image-tags.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: ev-platform

  # No syncPolicy.automated — operator must run `argocd app sync ev-ocpp-gateway`
  # Runbook: drain TypeScript WS connections → verify consumer lag < 500ms → sync
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
