# Auto-updated by CI after every successful docker push.
# DO NOT edit manually — use scripts/update-image-tags.sh or the CI workflow.
#
# Each entry overrides `image.tag` in the corresponding Helm chart.
# ArgoCD detects the commit and syncs automatically (Phase 2/3) or queues
# the change for manual review (Phase 4).

global:
  # Set by CI: git rev-parse --short HEAD
  imageTag: "latest"

