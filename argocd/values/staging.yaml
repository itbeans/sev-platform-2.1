# Helm value overrides applied to every service in staging.
# These are layered on top of each chart's default values.yaml.

replicaCount: 1

autoscaling:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Staging ingress — single wildcard host, no TLS
ingress:
  enabled: true
  className: kong
  annotations:
    konghq.com/strip-path: "true"
  tls: []
