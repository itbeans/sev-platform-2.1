image:
  repository: ghcr.io/itbeans/ev-scheduler
  tag: ""
  pullPolicy: IfNotPresent

# Singleton — prevents duplicate cron executions across pods
replicaCount: 1

service:
  type: ClusterIP
  httpPort: 8080   # health + metrics only
  grpcPort: 0
  wsPort: 0
  sessionAffinity: None

ingress:
  enabled: false
  className: kong
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 512Mi

# Scheduler must not scale — duplicate instances would fire cron jobs twice
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  LOG_LEVEL: "INFO"
  # MongoDB cleanup retention (days)
  LOG_RETENTION_DAYS: "90"

envFromSecrets:
  - ev-scheduler-secrets   # MONGO_URI, KAFKA_BOOTSTRAP

# Seconds the kubelet waits after SIGTERM before sending SIGKILL.
# Must be > the preStop sleep (5 s) + max request duration.
terminationGracePeriodSeconds: 60
