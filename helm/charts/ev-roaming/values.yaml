image:
  repository: ghcr.io/itbeans/ev-roaming
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 0
  wsPort: 0
  sessionAffinity: None

# OCPI and OICP partner networks reach this service from outside the cluster
ingress:
  enabled: true
  className: kong
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/https-redirect-status-code: "308"
  hosts:
    - host: roaming.example.com
      paths:
        - path: /ocpi
          pathType: Prefix
          portName: http
        - path: /oicp
          pathType: Prefix
          portName: http
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

env:
  LOG_LEVEL: "INFO"

envFromSecrets:
  - ev-roaming-secrets   # OCPI_TOKEN, OICP_CLIENT_CERT, MONGO_URI, KAFKA_BOOTSTRAP
