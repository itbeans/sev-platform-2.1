version: "3.9"

# ---------------------------------------------------------------------------
# Local development environment for ev-server-scala.
#
# Starts all infrastructure dependencies. Run Scala services separately with:
#   sbt ocpp-gateway/reStart
#   sbt rest-api/reStart
#   ...etc.
#
# Usage:
#   docker compose -f docker/docker-compose-local.yml up -d
#   docker compose -f docker/docker-compose-local.yml down -v
# ---------------------------------------------------------------------------

networks:
  ev-local:
    driver: bridge

volumes:
  mongo-data:
  postgres-data:
  kafka-data:

services:

  # ── MongoDB (single-node replica set for change stream + transaction support)
  mongo:
    image: mongo:7.0
    container_name: ev-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./init/mongo-init-rs.js:/docker-entrypoint-initdb.d/init-rs.js:ro
    networks:
      - ev-local
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL + TimescaleDB (billing + analytics)
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ev_local
      POSTGRES_USER:     ev
      POSTGRES_PASSWORD: ev_local_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ev-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ev -d ev_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Apache Kafka (KRaft mode, no ZooKeeper)
  # Two listeners:
  #   PLAINTEXT (9092)          — host machine access (localhost:9092)
  #   PLAINTEXT_INTERNAL (29092) — Docker-internal access (kafka:29092)
  kafka:
    image: apache/kafka:3.8.0
    container_name: ev-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID:                         1
      KAFKA_PROCESS_ROLES:                   broker,controller
      KAFKA_LISTENERS:                       PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS:            PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS:        1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES:       CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME:      PLAINTEXT_INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:  PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LOG_DIRS:                        /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:       "true"
      KAFKA_NUM_PARTITIONS:                  8
      KAFKA_DEFAULT_REPLICATION_FACTOR:      1
      KAFKA_LOG_RETENTION_HOURS:             168
    ports:
      - "9092:9092"    # host access
      - "29092:29092"  # exposed for debugging from host
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - ev-local
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Kafka UI (browse topics and messages during development)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ev-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME:            local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8090:8080"
    networks:
      - ev-local

  # ── Kong API Gateway (declarative config mode)
  kong:
    image: kong:3.8
    container_name: ev-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE:         "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG:  /dev/stderr
      KONG_ADMIN_ERROR_LOG:  /dev/stderr
      KONG_PROXY_LISTEN:     "0.0.0.0:80, 0.0.0.0:443 ssl"
      KONG_ADMIN_LISTEN:     "0.0.0.0:8001"
    ports:
      - "80:80"
      - "443:443"
      - "8001:8001"   # Kong Admin API
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    networks:
      - ev-local

  # ── Jaeger (all-in-one for distributed tracing)
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: ev-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks:
      - ev-local

  # ── Prometheus
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: ev-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - ev-local

  # ── Grafana
  grafana:
    image: grafana/grafana:11.4.0
    container_name: ev-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - ev-local
