global:
  scrape_interval: 15s

scrape_configs:
  - job_name: ev-ocpp-gateway
    static_configs:
      - targets: ['ocpp-gateway:8010']
    metrics_path: /metrics

  - job_name: ev-rest-api
    static_configs:
      - targets: ['rest-api:8080']
    metrics_path: /metrics

  - job_name: ev-auth-service
    static_configs:
      - targets: ['auth-service:8080']
    metrics_path: /metrics

  - job_name: ev-billing-service
    static_configs:
      - targets: ['billing-service:8080']
    metrics_path: /metrics

  - job_name: ev-pricing-service
    static_configs:
      - targets: ['pricing-service:8080']
    metrics_path: /metrics

  - job_name: ev-smart-charging
    static_configs:
      - targets: ['smart-charging:8080']
    metrics_path: /metrics

  - job_name: ev-roaming
    static_configs:
      - targets: ['roaming:8080']
    metrics_path: /metrics

  - job_name: ev-asset
    static_configs:
      - targets: ['asset:8080']
    metrics_path: /metrics

  - job_name: ev-scheduler
    static_configs:
      - targets: ['scheduler:8080']
    metrics_path: /metrics

  - job_name: ev-analytics
    static_configs:
      - targets: ['analytics:8080']
    metrics_path: /metrics
