# ev-smart-charging configuration
# All sensitive values should be supplied via environment variables in production.

kafka {
  bootstrapServers = ["localhost:9092"]
  bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
  groupId          = "ev-smart-charging"
  autoOffsetReset  = "latest"
}

smartCharging {
  # HTTP / gRPC ports
  httpPort = 8080
  httpPort = ${?SMART_CHARGING_HTTP_PORT}
  grpcPort = 9090
  grpcPort = ${?SMART_CHARGING_GRPC_PORT}

  # SAP Smart Charging Optimizer API
  # The optimizer endpoint receives the full fuse tree + active cars and
  # returns an optimized charging plan (amperage per 15-min slot).
  optimizerUrl      = "https://sap-optimizer.example.com/api/v1/profiles"
  optimizerUrl      = ${?SAP_OPTIMIZER_URL}
  optimizerUser     = "optimizer-user"
  optimizerUser     = ${?SAP_OPTIMIZER_USER}
  optimizerPassword = "CHANGE_ME"
  optimizerPassword = ${?SAP_OPTIMIZER_PASSWORD}

  # Behaviour tuning
  # debounceSecs: suppress duplicate triggers for the same siteAreaId within this window.
  # High-frequency events (MeterValues every 60 s) would otherwise hammer the optimizer.
  debounceSecs         = 5
  debounceSecs         = ${?SMART_CHARGING_DEBOUNCE_SECS}

  # periodicIntervalMins: fallback periodic recompute even without a Kafka trigger.
  # Catches scenarios where a trigger message was lost (at-least-once is not guaranteed).
  periodicIntervalMins = 15
  periodicIntervalMins = ${?SMART_CHARGING_PERIODIC_INTERVAL_MINS}

  # Physical defaults (used when site area or connector has no explicit value)
  defaultVoltage      = 230
  defaultVoltage      = ${?SMART_CHARGING_DEFAULT_VOLTAGE}
  defaultNumberPhases = 3
  defaultNumberPhases = ${?SMART_CHARGING_DEFAULT_NUMBER_PHASES}

  # Default tenant for single-tenant / dev deployments
  defaultTenantId = "default"
  defaultTenantId = ${?SMART_CHARGING_DEFAULT_TENANT_ID}

  # OCPP Gateway gRPC — for SetChargingProfile delivery after optimization
  gatewayGrpcHost = "ev-ocpp-gateway"
  gatewayGrpcHost = ${?OCPP_GATEWAY_GRPC_HOST}
  gatewayGrpcPort = 9090
  gatewayGrpcPort = ${?OCPP_GATEWAY_GRPC_PORT}
}

# MongoDB connection — shared with ev-ocpp-processor and ev-rest-api
mongo {
  uri          = "mongodb://localhost:27017"
  uri          = ${?MONGO_URI}
  databaseName = "evserver"
  databaseName = ${?MONGO_DB_NAME}
  maxPoolSize  = 10
  maxPoolSize  = ${?MONGO_MAX_POOL_SIZE}
}
