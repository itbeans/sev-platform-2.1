# ev-ocpp-gateway configuration

kafka {
  bootstrapServers = ["localhost:9092"]
  bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
  groupId          = "ev-ocpp-gateway"
  autoOffsetReset  = "latest"
}

gateway {
  httpPort = 8010
  httpPort = ${?GATEWAY_HTTP_PORT}

  grpcPort = 9090
  grpcPort = ${?GATEWAY_GRPC_PORT}

  jwtSecret = "change-me-in-production"
  jwtSecret = ${?JWT_SECRET}

  authGrpcHost = "localhost"
  authGrpcHost = ${?AUTH_GRPC_HOST}
  authGrpcPort = 50051
  authGrpcPort = ${?AUTH_GRPC_PORT}

  # OCPP response timeout per specification (30 s)
  responseTimeoutMs = 30000
  responseTimeoutMs = ${?GATEWAY_RESPONSE_TIMEOUT_MS}

  heartbeatIntervalSecs = 60
  heartbeatIntervalSecs = ${?GATEWAY_HEARTBEAT_INTERVAL_SECS}
}
