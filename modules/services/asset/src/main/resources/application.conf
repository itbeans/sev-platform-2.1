# ev-asset service configuration
# All sensitive values should be supplied via environment variables.

mongo {
  uri          = "mongodb://localhost:27017"
  uri          = ${?MONGO_URI}
  databaseName = "evserver"
  databaseName = ${?MONGO_DB_NAME}
  maxPoolSize  = 10
  maxPoolSize  = ${?MONGO_MAX_POOL_SIZE}
}

kafka {
  bootstrapServers = ["localhost:9092"]
  bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
  groupId          = "ev-asset"
  autoOffsetReset  = "earliest"
}

asset {
  # HTTP REST API port
  httpPort            = 8080
  httpPort            = ${?ASSET_HTTP_PORT}

  # How often to poll vendor APIs for dynamic asset consumption (seconds)
  pollIntervalSeconds = 60
  pollIntervalSeconds = ${?ASSET_POLL_INTERVAL_SECONDS}

  # Comma-separated list of tenant IDs to poll.
  # In Kubernetes, override via: ASSET_TENANT_IDS=tenant1,tenant2
  tenantIds = []
  tenantIds = ${?ASSET_TENANT_IDS}
}
