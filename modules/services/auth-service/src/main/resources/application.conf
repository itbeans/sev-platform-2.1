# ev-auth-service configuration
# All sensitive values MUST be supplied via environment variables in production.

mongo {
  uri          = "mongodb://localhost:27017"
  uri          = ${?MONGO_URI}
  databaseName = "evserver"
  databaseName = ${?MONGO_DB_NAME}
  maxPoolSize  = 10
  maxPoolSize  = ${?MONGO_MAX_POOL_SIZE}
}

auth {
  # HTTP REST API port
  httpPort = 8080
  httpPort = ${?AUTH_HTTP_PORT}

  # gRPC server port (ValidateToken, ResolveOcppAuthorize, ResolveTenant)
  grpcPort = 9090
  grpcPort = ${?AUTH_GRPC_PORT}

  # JWT signing secret — MUST match the TypeScript `userTokenKey` in
  # CentralSystemRestServiceConfiguration. Override in Kubernetes via Secret.
  userTokenKey = "CHANGE_ME_IN_PRODUCTION"
  userTokenKey = ${?AUTH_JWT_SECRET}

  # Token lifetime for regular users (hours)
  userTokenLifetimeHours = 12
  userTokenLifetimeHours = ${?AUTH_TOKEN_LIFETIME_HOURS}

  # Token lifetime for demo users (days)
  userDemoTokenLifetimeDays = 1
  userDemoTokenLifetimeDays = ${?AUTH_DEMO_TOKEN_LIFETIME_DAYS}

  # Token lifetime for technical/B2B users (days)
  userTechnicalTokenLifetimeDays = 365
  userTechnicalTokenLifetimeDays = ${?AUTH_TECHNICAL_TOKEN_LIFETIME_DAYS}

  # Number of wrong password attempts before account lockout
  passwordWrongNumberOfTrial = 10
  passwordWrongNumberOfTrial = ${?AUTH_PASSWORD_WRONG_TRIAL_COUNT}

  # How long (minutes) an account stays locked after too many wrong attempts
  passwordBlockedWaitTimeMin = 60
  passwordBlockedWaitTimeMin = ${?AUTH_PASSWORD_BLOCKED_WAIT_MINS}

  # Super-admin tenant ID (used when no subdomain is provided)
  defaultTenantId = "default"
  defaultTenantId = ${?AUTH_DEFAULT_TENANT_ID}
}
