# ev-billing-service configuration
# All sensitive values should be supplied via environment variables in production.

kafka {
  bootstrapServers = ["localhost:9092"]
  bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
  groupId          = "ev-billing"
  autoOffsetReset  = "earliest"
}

billing {
  # HTTP / gRPC ports
  httpPort = 8080
  httpPort = ${?BILLING_HTTP_PORT}
  grpcPort = 9090
  grpcPort = ${?BILLING_GRPC_PORT}

  # Stripe credentials — MUST be overridden in production via env vars
  stripeSecretKey     = "sk_test_CHANGE_ME"
  stripeSecretKey     = ${?STRIPE_SECRET_KEY}
  stripeWebhookSecret = "whsec_CHANGE_ME"
  stripeWebhookSecret = ${?STRIPE_WEBHOOK_SECRET}

  # Billing behaviour
  # immediatePayment=true: finalize + charge invoice immediately after transaction stop
  # immediatePayment=false: create draft invoice; periodic task charges on monthlyBillingDay
  immediatePayment   = false
  immediatePayment   = ${?BILLING_IMMEDIATE_PAYMENT}
  monthlyBillingDay  = 1
  monthlyBillingDay  = ${?BILLING_MONTHLY_BILLING_DAY}

  # Platform fees (CPO payouts)
  platformFeePercent         = 2.5
  platformFeePercent         = ${?BILLING_PLATFORM_FEE_PERCENT}
  platformFeeCentsPerSession = 0
  platformFeeCentsPerSession = ${?BILLING_PLATFORM_FEE_CENTS_PER_SESSION}

  # PostgreSQL connection (billing data — NOT the main ev-server MongoDB)
  jdbcUrl      = "jdbc:postgresql://localhost:5432/ev_billing"
  jdbcUrl      = ${?BILLING_JDBC_URL}
  jdbcUser     = "ev_billing"
  jdbcUser     = ${?BILLING_JDBC_USER}
  jdbcPassword = "ev_billing"
  jdbcPassword = ${?BILLING_JDBC_PASSWORD}

  # Default tenant for periodic tasks in single-tenant deployments
  defaultTenantId = "default"
  defaultTenantId = ${?BILLING_DEFAULT_TENANT_ID}
}
