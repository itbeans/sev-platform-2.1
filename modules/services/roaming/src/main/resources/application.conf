# ev-roaming service configuration
# All sensitive values should be supplied via environment variables in production.

mongo {
  uri          = "mongodb://localhost:27017"
  uri          = ${?MONGO_URI}
  databaseName = "evserver"
  databaseName = ${?MONGO_DB_NAME}
  maxPoolSize  = 10
  maxPoolSize  = ${?MONGO_MAX_POOL_SIZE}
}

kafka {
  bootstrapServers = ["localhost:9092"]
  bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
  groupId          = "ev-roaming"
  autoOffsetReset  = "earliest"
}

roaming {
  # HTTP port
  httpPort = 8080
  httpPort = ${?ROAMING_HTTP_PORT}

  # OCPI identity — who we are in the roaming network
  ocpiCountryCode  = "DE"
  ocpiCountryCode  = ${?OCPI_COUNTRY_CODE}
  ocpiPartyId      = "EVX"
  ocpiPartyId      = ${?OCPI_PARTY_ID}
  ocpiOperatorName = "EV Server"
  ocpiOperatorName = ${?OCPI_OPERATOR_NAME}

  # Token used to authenticate inbound OCPI calls.
  # MUST be changed to a strong random value in production.
  ocpiLocalToken = "CHANGE_ME_IN_PRODUCTION"
  ocpiLocalToken = ${?OCPI_LOCAL_TOKEN}

  # External URL base (how OCPI partners reach us via Kong/load balancer)
  externalUrl = "https://csms.example.com"
  externalUrl = ${?ROAMING_EXTERNAL_URL}

  # Default tenant for credential exchange
  defaultTenantId = "default"
  defaultTenantId = ${?ROAMING_DEFAULT_TENANT_ID}

  # OCPI background patch job interval (hours); 0 = disabled.
  # Refreshes credentials with registered EMSP partners.
  patchJobIntervalHours = 12
  patchJobIntervalHours = ${?ROAMING_PATCH_JOB_INTERVAL_HOURS}
}
