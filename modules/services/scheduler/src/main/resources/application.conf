# ev-scheduler configuration
# All sensitive values should be supplied via environment variables in production.

mongo {
  uri          = "mongodb://localhost:27017"
  uri          = ${?MONGO_URI}
  databaseName = "evserver"
  databaseName = ${?MONGO_DB_NAME}
  maxPoolSize  = 5
  maxPoolSize  = ${?MONGO_MAX_POOL_SIZE}
}

kafka {
  bootstrapServers = ["localhost:9092"]
  bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
  groupId          = "ev-scheduler"
  autoOffsetReset  = "earliest"
}

scheduler {
  httpPort = 8080
  httpPort = ${?SCHEDULER_HTTP_PORT}

  # ── Task intervals ────────────────────────────────────────────────────
  checkOfflineStationsIntervalMins  = 5
  checkOfflineStationsIntervalMins  = ${?SCHEDULER_OFFLINE_INTERVAL_MINS}

  closeTransactionsIntervalHours    = 24
  closeTransactionsIntervalHours    = ${?SCHEDULER_CLOSE_TX_INTERVAL_HOURS}

  cleanupLogsIntervalHours          = 168    # weekly
  cleanupLogsIntervalHours          = ${?SCHEDULER_CLEANUP_INTERVAL_HOURS}

  checkUserInactivityIntervalHours  = 168    # weekly
  checkUserInactivityIntervalHours  = ${?SCHEDULER_INACTIVITY_INTERVAL_HOURS}

  # ── Thresholds ───────────────────────────────────────────────────────
  # Station is considered offline after this many seconds without a heartbeat
  stationOfflineThresholdSecs       = 540    # 9 minutes
  stationOfflineThresholdSecs       = ${?SCHEDULER_OFFLINE_THRESHOLD_SECS}

  # Transactions started more than N hours ago with no stop are force-closed
  staleTransactionThresholdHours    = 24
  staleTransactionThresholdHours    = ${?SCHEDULER_STALE_TX_THRESHOLD_HOURS}

  # Logs and performance records older than N days are deleted
  logRetentionDays                  = 7
  logRetentionDays                  = ${?SCHEDULER_LOG_RETENTION_DAYS}

  # Notify users inactive for this many months
  userInactivityMonths              = 6
  userInactivityMonths              = ${?SCHEDULER_USER_INACTIVITY_MONTHS}

  # ── Feature flags (set to false to disable in specific environments) ──
  offlineStationsTaskEnabled        = true
  offlineStationsTaskEnabled        = ${?SCHEDULER_OFFLINE_STATIONS_ENABLED}

  closeTransactionsTaskEnabled      = true
  closeTransactionsTaskEnabled      = ${?SCHEDULER_CLOSE_TRANSACTIONS_ENABLED}

  cleanupLogsTaskEnabled            = true
  cleanupLogsTaskEnabled            = ${?SCHEDULER_CLEANUP_LOGS_ENABLED}

  userInactivityTaskEnabled         = true
  userInactivityTaskEnabled         = ${?SCHEDULER_USER_INACTIVITY_ENABLED}

  # ── Distributed lock ─────────────────────────────────────────────────
  # Lock TTL in seconds — a pod that crashes will release the lock after this window
  lockDurationSecs                  = 300    # 5 minutes
  lockDurationSecs                  = ${?SCHEDULER_LOCK_DURATION_SECS}

  # Default tenant for single-tenant deployments (scheduler uses all tenants from DB)
  defaultTenantId                   = "default"
  defaultTenantId                   = ${?SCHEDULER_DEFAULT_TENANT_ID}
}
