# ev-ocpp-processor configuration

kafka {
  bootstrapServers = ["localhost:9092"]
  bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
  groupId          = "ev-ocpp-processor"
  groupId          = ${?KAFKA_GROUP_ID}
  autoOffsetReset  = "earliest"
  autoOffsetReset  = ${?KAFKA_AUTO_OFFSET_RESET}
}

processor {
  mongoUri    = "mongodb://localhost:27017"
  mongoUri    = ${?MONGODB_URI}
  mongoDbName = "evse"
  mongoDbName = ${?MONGODB_DBNAME}

  authGrpcHost    = "localhost"
  authGrpcHost    = ${?AUTH_GRPC_HOST}
  authGrpcPort    = 50051
  authGrpcPort    = ${?AUTH_GRPC_PORT}

  pricingGrpcHost = "localhost"
  pricingGrpcHost = ${?PRICING_GRPC_HOST}
  pricingGrpcPort = 50052
  pricingGrpcPort = ${?PRICING_GRPC_PORT}

  gatewayGrpcHost = "localhost"
  gatewayGrpcHost = ${?OCPP_GATEWAY_GRPC_HOST}
  gatewayGrpcPort = 9091
  gatewayGrpcPort = ${?OCPP_GATEWAY_GRPC_PORT}

  consumerGroupId = "ev-ocpp-processor"
  consumerGroupId = ${?KAFKA_GROUP_ID}

  stationOfflineThresholdSecs = 540
  stationOfflineThresholdSecs = ${?STATION_OFFLINE_THRESHOLD_SECS}
}
