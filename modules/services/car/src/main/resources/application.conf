# ev-car service configuration
# All sensitive values should be supplied via environment variables.

mongo {
  uri          = "mongodb://localhost:27017"
  uri          = ${?MONGO_URI}
  databaseName = "evserver"
  databaseName = ${?MONGO_DB_NAME}
  maxPoolSize  = 10
}

car {

  grpcPort = 9090
  grpcPort = ${?CAR_GRPC_PORT}

  evDatabase {
    # EV Database API base URL (https://ev-database.org/api)
    url = "https://ev-database.org/api"
    url = ${?EV_DATABASE_URL}

    # API key (supplied as path component: GET {url}/{key})
    key = ""
    key = ${?EV_DATABASE_KEY}
  }

  # ISO-8601 duration — how often to sync the car catalog
  syncInterval = "PT4H"
  syncInterval = ${?CAR_SYNC_INTERVAL}

  connectors {

    mercedes {
      enabled           = false
      enabled           = ${?MERCEDES_ENABLED}
      clientId          = ""
      clientId          = ${?MERCEDES_CLIENT_ID}
      clientSecret      = ""
      clientSecret      = ${?MERCEDES_CLIENT_SECRET}
      authenticationUrl = "https://id.mercedes-benz.com"
      authenticationUrl = ${?MERCEDES_AUTH_URL}
      apiUrl            = "https://api.mercedes-benz.com"
      apiUrl            = ${?MERCEDES_API_URL}
    }

    tronity {
      enabled      = false
      enabled      = ${?TRONITY_ENABLED}
      clientId     = ""
      clientId     = ${?TRONITY_CLIENT_ID}
      clientSecret = ""
      clientSecret = ${?TRONITY_CLIENT_SECRET}
      apiUrl       = "https://api.tronity.io"
      apiUrl       = ${?TRONITY_API_URL}
    }

    targaTelematics {
      enabled           = false
      enabled           = ${?TARGA_ENABLED}
      clientId          = ""
      clientId          = ${?TARGA_CLIENT_ID}
      clientSecret      = ""
      clientSecret      = ${?TARGA_CLIENT_SECRET}
      authenticationUrl = "https://identity.targatelematics.com"
      authenticationUrl = ${?TARGA_AUTH_URL}
      apiUrl            = "https://api.targatelematics.com"
      apiUrl            = ${?TARGA_API_URL}
    }

  }

}
