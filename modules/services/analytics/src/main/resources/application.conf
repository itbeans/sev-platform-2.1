# ev-analytics configuration
# All sensitive values should be supplied via environment variables in production.

kafka {
  bootstrapServers = ["localhost:9092"]
  bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
  groupId          = "ev-analytics"
  autoOffsetReset  = "earliest"
}

analytics {
  httpPort = 8080
  httpPort = ${?ANALYTICS_HTTP_PORT}

  # TimescaleDB (PostgreSQL extension) — NOT the main ev-server MongoDB
  jdbcUrl      = "jdbc:postgresql://localhost:5432/ev_analytics"
  jdbcUrl      = ${?ANALYTICS_JDBC_URL}
  jdbcUser     = "ev_analytics"
  jdbcUser     = ${?ANALYTICS_JDBC_USER}
  jdbcPassword = "ev_analytics"
  jdbcPassword = ${?ANALYTICS_JDBC_PASSWORD}

  # Data retention — older data is compressed/dropped by TimescaleDB policies.
  # These values mirror what is configured in V1__analytics_schema.sql.
  # Change the policies in SQL to adjust; these config values drive the
  # application-level retention sweep for tenants not covered by the policy.
  logRetentionDays         = 90
  logRetentionDays         = ${?ANALYTICS_LOG_RETENTION_DAYS}
  consumptionRetentionDays = 365
  consumptionRetentionDays = ${?ANALYTICS_CONSUMPTION_RETENTION_DAYS}

  defaultTenantId = "default"
  defaultTenantId = ${?ANALYTICS_DEFAULT_TENANT_ID}
}
