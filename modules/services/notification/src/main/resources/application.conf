# ev-notification service configuration
# All sensitive values should be supplied via environment variables.

mongo {
  uri          = "mongodb://localhost:27017"
  uri          = ${?MONGO_URI}
  databaseName = "evserver"
  databaseName = ${?MONGO_DB_NAME}
  maxPoolSize  = 10
}

kafka {
  bootstrapServers = ["localhost:9092"]
  bootstrapServers = ${?KAFKA_BOOTSTRAP_SERVERS}
  groupId          = "ev-notification"
  autoOffsetReset  = "earliest"
}

notification {

  smtp {
    host     = "smtp.example.com"
    host     = ${?SMTP_HOST}
    port     = 587
    port     = ${?SMTP_PORT}
    user     = ""
    user     = ${?SMTP_USER}
    password = ""
    password = ${?SMTP_PASSWORD}
    from     = "noreply@example.com"
    from     = ${?SMTP_FROM}
    tls      = true
    tls      = ${?SMTP_TLS}
  }

  fcm {
    # Google Cloud project ID (e.g. "my-project-12345")
    projectId          = ""
    projectId          = ${?FCM_PROJECT_ID}

    # Inline JSON string of the Firebase service account credentials.
    # In Kubernetes, mount this from a Secret:
    #   env: [{ name: FCM_SERVICE_ACCOUNT_JSON, valueFrom: { secretKeyRef: ... } }]
    serviceAccountJson = ""
    serviceAccountJson = ${?FCM_SERVICE_ACCOUNT_JSON}

    # Set to true only in production — disables FCM entirely in local/CI environments.
    enabled = false
    enabled = ${?FCM_ENABLED}
  }
}
