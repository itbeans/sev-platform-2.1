# ev-rest-api configuration
# All sensitive values should be supplied via environment variables in production.

restApi {
  httpPort = 8080
  httpPort = ${?REST_API_HTTP_PORT}

  # MongoDB — shared with TypeScript monolith during transition period
  mongoUri    = "mongodb://localhost:27017"
  mongoUri    = ${?MONGODB_URI}
  mongoDbName = "evse"
  mongoDbName = ${?MONGODB_DBNAME}

  # JWT secret for token validation (must match ev-auth-service)
  jwtSecret = "change-me-in-production"
  jwtSecret = ${?JWT_SECRET}

  # ev-auth-service gRPC
  authGrpcHost = "localhost"
  authGrpcHost = ${?AUTH_GRPC_HOST}
  authGrpcPort = 9090
  authGrpcPort = ${?AUTH_GRPC_PORT}

  # ev-ocpp-gateway gRPC
  ocppGatewayGrpcHost = "localhost"
  ocppGatewayGrpcHost = ${?OCPP_GATEWAY_GRPC_HOST}
  ocppGatewayGrpcPort = 9091
  ocppGatewayGrpcPort = ${?OCPP_GATEWAY_GRPC_PORT}

  # ev-billing-service gRPC
  billingGrpcHost = "localhost"
  billingGrpcHost = ${?BILLING_GRPC_HOST}
  billingGrpcPort = 9092
  billingGrpcPort = ${?BILLING_GRPC_PORT}

  # ev-analytics base URL (for statistics and logs proxy)
  analyticsBaseUrl = "http://localhost:8090"
  analyticsBaseUrl = ${?ANALYTICS_BASE_URL}
}
