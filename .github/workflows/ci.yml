name: CI

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:

  # ── 1. Format check ──────────────────────────────────────────────────────────
  lint:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: scalafmt check
        run: sbt scalafmtCheckAll

  # ── 2. Compile + test + coverage ─────────────────────────────────────────────
  test:
    name: Test + coverage
    runs-on: ubuntu-latest
    needs: lint
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: evse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Compile all modules
        run: sbt compile
      - name: Test with coverage
        env:
          MONGO_URI: mongodb://localhost:27017
          PG_URI: postgresql://postgres:test@localhost:5432/evse_test
        run: sbt coverage test coverageAggregate
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: target/scala-*/scoverage-report/

  # ── 3. Docker build + push (matrix) ─────────────────────────────────────────
  docker:
    name: Docker — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: test
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - { sbt: ocppGateway,    name: ev-ocpp-gateway }
          - { sbt: ocppProcessor,  name: ev-ocpp-processor }
          - { sbt: restApi,        name: ev-rest-api }
          - { sbt: authService,    name: ev-auth-service }
          - { sbt: billingService, name: ev-billing-service }
          - { sbt: pricingService, name: ev-pricing-service }
          - { sbt: smartCharging,  name: ev-smart-charging }
          - { sbt: notification,   name: ev-notification }
          - { sbt: roaming,        name: ev-roaming }
          - { sbt: asset,          name: ev-asset }
          - { sbt: car,            name: ev-car }
          - { sbt: scheduler,      name: ev-scheduler }
          - { sbt: analytics,      name: ev-analytics }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service.name }}
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          REPO="${{ env.REGISTRY }}/${{ github.repository_owner }}"
          sbt \
            "set ThisBuild / Docker / dockerRepository := Some(\"${REPO}\")" \
            "set ThisBuild / Docker / version := \"${IMAGE_TAG}\"" \
            "${{ matrix.service.sbt }}/Docker/publish"

  # ── 4. Update ArgoCD image-tags.yaml ────────────────────────────────────────
  update-image-tags:
    name: Update image-tags.yaml
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Write new image tag
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          sed -i "s|^  imageTag: .*|  imageTag: \"${IMAGE_TAG}\"|" argocd/values/image-tags.yaml
      - name: Commit updated tags
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add argocd/values/image-tags.yaml
          git diff --staged --quiet || git commit -m "ci: update imageTag to ${IMAGE_TAG} [skip ci]"
          git push
